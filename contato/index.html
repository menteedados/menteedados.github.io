<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Mente & Dados</title>
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/variables.css">
    <style>
        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: #faf8f2;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #0f1e3d; font-family: 'Playfair Display', serif; }
        .email {
            background: #f5ecd4;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin: 2rem 0;
        }
        .back-link {
            display: inline-block;
            color: #c9a84c;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contato</h1>
        <div class="email">
            📧 contato@menteedados.com
        </div>
        <p>Para parcerias, dúvidas ou sugestões, envie um email.</p>
        <a href="/" class="back-link">← Voltar para Home</a>
    </div>
</body>
</html>
